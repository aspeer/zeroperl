name: Build, qualify and stage npm release

on:
  push:
    tags:
      - 'aspeer-zeroperl_*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      perls: ${{ steps.config.outputs.perls }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate paired annotated tags and release configuration
        id: config
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          node tools/release.mjs validate
          git merge-base --is-ancestor HEAD origin/main
          node tools/release-config.mjs >> "$GITHUB_OUTPUT"

  build-package-stage:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ${{ fromJSON(needs.release.outputs.perls) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PERL_VERSION: ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install staging-capable npm
        run: npm install --global npm@11.19.1
      - name: Set release metadata
        run: |
          node tools/release-metadata.mjs shell "$PERL_VERSION" >> "$GITHUB_ENV"
      - name: Install verifier dependencies
        run: |
          npm --prefix tools ci
          npm ci --ignore-scripts
      - name: Test release tooling and package contracts
        run: |
          node --test t.js/*.test.mjs
          python3 -B tests/test_compact_notices.py
      - name: Build once from the tagged source
        env:
          BUILD_EXIFTOOL: 'false'
          ZEROPERL_EMBED_PREFIX: 'true'
        run: ./build.sh run off
      - name: Set artifact paths and check source identity
        run: |
          echo "PACKAGE_SOURCE=output/$PERL_VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=zeroperl-webdyne-$RELEASE_ID.tar.gz" >> "$GITHUB_ENV"
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync(`output/${process.env.PERL_VERSION}/manifest-${process.env.RELEASE_ID}.json`));
          if(m.source.dirty || m.source.revision !== process.env.GITHUB_SHA || m.releaseVersion !== process.env.NPM_VERSION) throw Error('Manifest does not match tagged release');
          JS
      - name: Verify versioned build products
        run: |
          set -euo pipefail
          artifact_dir="output/${PERL_VERSION}"
          wasm="${artifact_dir}/zeroperl-webdyne-${RELEASE_ID}.wasm"
          reactor="${artifact_dir}/zeroperl-webdyne-reactor-${RELEASE_ID}.wasm"
          prefix="${artifact_dir}/perl-wasi-prefix-${RELEASE_ID}"
          checksums="${artifact_dir}/SHA256SUMS-${RELEASE_ID}"
          (cd "$artifact_dir" && shasum -a 256 -c "$(basename "$checksums")")
          python3 tools/verify-notices.py "$artifact_dir/third-party-notices-${RELEASE_ID}.tar.gz"
          node tools/verify-embedded-inc.mjs "$wasm"
          node tools/wasm-smoke.mjs "$wasm"
          node tools/smoke-socket.mjs "$wasm" "$prefix"
          node tools/smoke-asyncify-free.mjs "$wasm" "$prefix"
          node tools/check-runtime-lifecycle.mjs "$wasm" js/zeroperl.js
          node tools/check-cpan-versions.mjs "$wasm" "$PERL_VERSION"
          node tools/check-xs-magic.mjs "$wasm"
          node tools/check-asyncify-reentry.mjs "$wasm"
          node --input-type=module - "$wasm" "$reactor" <<'NODE'
          import { readFile } from "node:fs/promises";
          for (const path of process.argv.slice(2)) {
            if (!WebAssembly.validate(await readFile(path))) {
              throw new Error(`Invalid WebAssembly binary: ${path}`);
            }
          }
          NODE

      - name: Assemble deterministic release and distribution trees
        run: |
          set -euo pipefail
          artifact_dir="output/${PERL_VERSION}"
          archive_base="zeroperl-webdyne-${RELEASE_ID}"
          release_dir="dist/github/${RELEASE_ID}"
          archive_root="${release_dir}/${archive_base}"
          distribution_dir="dist/distribution-repository/dist/${PERL_VERSION}"
          mkdir -p "$archive_root" "$distribution_dir"
          cp "$artifact_dir/zeroperl-webdyne-${RELEASE_ID}.wasm" "$archive_root/"
          cp "$artifact_dir/zeroperl-webdyne-reactor-${RELEASE_ID}.wasm" "$archive_root/"
          cp "$artifact_dir/config-${RELEASE_ID}.h" "$archive_root/"
          cp -R "$artifact_dir/perl-wasi-prefix-${RELEASE_ID}" "$archive_root/"
          cp "$artifact_dir/manifest-${RELEASE_ID}.json" "$archive_root/"
          cp "$artifact_dir/SHA256SUMS-${RELEASE_ID}" "$archive_root/"
          cp LICENSE THIRD-PARTY-NOTICES.md "$archive_root/"
          cp -R licenses "$archive_root/"
          cp "$artifact_dir/third-party-notices-${RELEASE_ID}.tar.gz" "$archive_root/"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            -czf "${release_dir}/${ARCHIVE_NAME}" \
            -C "$release_dir" "$archive_base"
          (
            cd "$release_dir"
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          )
          cp "$artifact_dir/zeroperl-webdyne-${RELEASE_ID}.wasm" "$distribution_dir/"
          cp "$artifact_dir/zeroperl-webdyne-reactor-${RELEASE_ID}.wasm" "$distribution_dir/"
          cp "$artifact_dir/manifest-${RELEASE_ID}.json" "$distribution_dir/"
          cp "$artifact_dir/third-party-notices-${RELEASE_ID}.tar.gz" "$distribution_dir/"
          cp -R licenses "$distribution_dir/"
          cp LICENSE THIRD-PARTY-NOTICES.md "$distribution_dir/"
          cp "$artifact_dir/SHA256SUMS-${RELEASE_ID}" "$distribution_dir/"

      - name: Attest qualified binaries and release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            output/${{ matrix.perl }}/zeroperl-webdyne-${{ env.RELEASE_ID }}.wasm
            output/${{ matrix.perl }}/zeroperl-webdyne-reactor-${{ env.RELEASE_ID }}.wasm
            dist/github/${{ env.RELEASE_ID }}/${{ env.ARCHIVE_NAME }}

      - name: Prepare npm distribution directory
        run: |
          set -euo pipefail
          package_dir="dist/npm/${RELEASE_ID}/package"
          node tools/prepare-npm-package.mjs \
            --source "$PACKAGE_SOURCE" \
            --destination "$package_dir" \
            --manifest "manifest-${RELEASE_ID}.json" \
            --wasm "zeroperl-webdyne-${RELEASE_ID}.wasm" \
            --reactor "zeroperl-webdyne-reactor-${RELEASE_ID}.wasm"
          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Pack and inspect npm tarball
        run: |
          set -euo pipefail
          tarball_dir="dist/npm/${RELEASE_ID}/tarball"
          mkdir -p "$tarball_dir"
          npm pack "./$PACKAGE_DIR" --pack-destination "$tarball_dir" --json > "$tarball_dir/pack.json"
          tarball="$(find "$tarball_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          tar -tzf "$tarball" | sort > "$tarball_dir/actual-files.txt"
          {
            echo package/LICENSE
            echo package/THIRD-PARTY-NOTICES.md
            echo package/THIRD-PARTY-LICENSES.txt
            find licenses -type f -print | sed 's#^#package/#'
            echo package/README.md
            echo package/bin/pagi-runner.pl
            echo package/bin/webdyne-app.pl
            echo package/embedded-files.json
            echo package/index.js
            echo package/js/provider/cloudflare.js
            echo package/js/runtime/config.js
            echo package/js/runtime/extensions.js
            echo package/js/runtime/perl-filesystem.js
            echo package/js/runtime/webdyne-runtime.js
            echo package/js/transport/fetch-pagi.js
            echo package/js/worker.js
            echo package/js/zeroperl.js
            echo package/lib/Future/IO/Impl/ZeroPerl.pm
            echo package/manifest.json
            echo package/package.json
            echo package/scripts/build-vfs.mjs
            echo package/scripts/extensions.mjs
            echo package/scripts/install-cpan.mjs
            echo package/scripts/webdyne-cloudflare.mjs
            echo "package/zeroperl-webdyne-${RELEASE_ID}.wasm"
          } | sort > "$tarball_dir/expected-files.txt"
          diff -u "$tarball_dir/expected-files.txt" "$tarball_dir/actual-files.txt"
          mkdir -p "$tarball_dir/unpacked"
          tar -xzf "$tarball" -C "$tarball_dir/unpacked"
          node --input-type=module - \
            "$tarball_dir/unpacked/package/zeroperl-webdyne-${RELEASE_ID}.wasm" <<'NODE'
          import { readFile } from "node:fs/promises";
          for (const path of process.argv.slice(2)) {
            if (!WebAssembly.validate(await readFile(path))) {
              throw new Error(`Invalid packaged WebAssembly binary: ${path}`);
            }
          }
          NODE
          node tools/check-npm-size.mjs "$tarball" "$tarball_dir/pack.json"
          node tools/check-runtime-lifecycle.mjs "$tarball_dir/unpacked/package/zeroperl-webdyne-${RELEASE_ID}.wasm" "$tarball_dir/unpacked/package/js/zeroperl.js"
          npm stage publish "$tarball" --access public --dry-run
          echo "NPM_TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Attest the npm package candidate
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.NPM_TARBALL }}

      - name: Upload npm package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webdyne-zeroperl-npm-${{ env.RELEASE_ID }}
          path: |
            dist/npm/${{ env.RELEASE_ID }}/package/
            dist/npm/${{ env.RELEASE_ID }}/tarball/*.tgz
            dist/npm/${{ env.RELEASE_ID }}/tarball/pack.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve diagnostic build evidence (not an npm dependency)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zeroperl-diagnostics-${{ matrix.perl }}-${{ github.ref_name }}
          path: dist/github/
          if-no-files-found: error
          retention-days: 90
      - name: Submit validated tarball to npm staging
        run: node tools/stage-package.mjs "$NPM_TARBALL" "dist/npm/$RELEASE_ID/tarball/pack.json"
